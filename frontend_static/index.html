<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trackify - Loading Workspace...</title>
    <!-- Bootstrap 5.3 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.2) 0px, transparent 50%);
        }

        .loader-card {
            background: #1e293b;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 40px 32px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        .pulse-ring {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 24px;
        }

        .pulse-ring::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #6366f1;
            animation: ripple 1.8s infinite ease-out;
        }

        @keyframes ripple {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.6); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="loader-card">
    <div class="pulse-ring">
        <div class="spinner-border text-primary" role="status" style="width: 2.2rem; height: 2.2rem;"></div>
    </div>
    <h4 id="statusTitle" class="fw-bold mb-2">Connecting to Trackify...</h4>
    <p id="statusDesc" class="text-white-50 small mb-4">
        Directly connecting to your cloud workspace. Please hold on...
    </p>

    <div class="progress bg-dark mb-3" style="height: 6px; border-radius: 3px;">
        <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-primary" role="progressbar" style="width: 35%"></div>
    </div>

    <div class="d-flex justify-content-between align-items-center text-white-50 small">
        <span id="elapsedText">Status: <strong>Connecting</strong></span>
        <span>Auto-Redirecting</span>
    </div>
</div>

<script>
    const LIVE_BACKEND_URL = "https://trackify-backend-uflh.onrender.com";
    const TARGET_PAGE = `${LIVE_BACKEND_URL}/login/`;
    
    let seconds = 0;
    let timerInterval = null;
    let isConnected = false;

    // Start timer display if it takes more than 1 second (sleeping backend)
    setTimeout(() => {
        if (!isConnected) {
            document.getElementById('statusTitle').innerText = "⚡ Waking Up Server...";
            document.getElementById('statusDesc').innerText = "Render Free Tier spins down inactive instances. Booting instances now (takes ~25s)...";
            timerInterval = setInterval(() => {
                seconds++;
                document.getElementById('elapsedText').innerHTML = `Elapsed: <strong class="text-white">${seconds}s</strong>`;
                let p = Math.min(35 + seconds * 2.5, 95);
                document.getElementById('progressBar').style.width = `${p}%`;
            }, 1000);
        }
    }, 1200);

    function pingAndRedirect() {
        fetch(`${LIVE_BACKEND_URL}/api/health/`, { cache: 'no-store' })
            .then(res => res.json())
            .then(() => {
                isConnected = true;
                if (timerInterval) clearInterval(timerInterval);
                document.getElementById('progressBar').style.width = '100%';
                document.getElementById('statusTitle').innerText = "✅ Ready! Launching...";
                // Instant seamless auto-redirect to live app
                window.location.replace(TARGET_PAGE);
            })
            .catch(() => {
                // Retry every 2.5 seconds until awake
                setTimeout(pingAndRedirect, 2500);
            });
    }

    // Fire immediately
    pingAndRedirect();
</script>

</body>
</html>
